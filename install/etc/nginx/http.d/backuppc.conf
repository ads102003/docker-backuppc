server {
    listen 80 default_server;
    server_name _;
    root /www/html;

    access_log /www/logs/nginx-access.log;
    error_log /www/logs/nginx-error.log;

    include /etc/nginx/backuppc-auth.conf;

    location = / {
        return 302 /index.cgi;
    }

    location ~ \.cgi$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/fcgiwrap.sock;
        fastcgi_read_timeout 600s;

        ## Always run the UI as the backuppc admin user
        fastcgi_param REMOTE_ADDR     $remote_addr;
        fastcgi_param REMOTE_USER     backuppc;
        fastcgi_param SCRIPT_FILENAME /www/cgi-bin/BackupPC/BackupPC_Admin;
    }
}
